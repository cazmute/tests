<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="CZM Painel">
<meta name="mobile-web-app-capable" content="yes">
<title>CZM Painel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg:        #000000;
  --bg1:       #0a0a0a;
  --bg2:       #111111;
  --bg3:       #1a1a1a;
  --bg4:       #222222;
  --border:    rgba(255,255,255,0.07);
  --border2:   rgba(255,255,255,0.12);
  --txt:       #ffffff;
  --txt2:      rgba(255,255,255,0.55);
  --txt3:      rgba(255,255,255,0.28);
  --accent:    #00c896;
  --accent-bg: rgba(0,200,150,0.1);
  --red:       #ff453a;
  --red-bg:    rgba(255,69,58,0.1);
  --blue:      #0a84ff;
  --blue-bg:   rgba(10,132,255,0.1);
  --pix:       #32d74b;
  --pix-bg:    rgba(50,215,75,0.1);
  --radius-sm: 8px;
  --radius:    12px;
  --radius-lg: 18px;
  --safe-top:  env(safe-area-inset-top);
  --safe-bot:  env(safe-area-inset-bottom);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body {
  height: 100%; height: 100dvh;
  background: var(--bg); color: var(--txt);
  font-family: 'Montserrat', -apple-system, sans-serif;
  font-size: 14px; -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
}

::-webkit-scrollbar { width: 3px; height: 3px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 2px; }

/* ── LOGIN ── */
#login-screen {
  position: fixed; inset: 0; background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  z-index: 9999; padding: 24px;
}
#login-screen.hidden { display: none; }

.login-box {
  width: 100%; max-width: 320px;
  display: flex; flex-direction: column; align-items: center;
}
.login-logo {
  width: 64px; height: 64px;
  background: var(--bg2); border: 1px solid var(--border2);
  border-radius: 18px;
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 28px; overflow: hidden;
}
.login-logo img { width: 100%; height: 100%; object-fit: cover; }

.login-box h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; margin-bottom: 6px; text-align: center; }
.login-box p  { font-size: 13px; color: var(--txt2); margin-bottom: 40px; text-align: center; font-weight: 400; }

.pin-dots { display: flex; gap: 16px; margin-bottom: 32px; }
.pin-dot {
  width: 14px; height: 14px; border-radius: 50%;
  border: 1.5px solid var(--border2); background: transparent;
  transition: background 0.15s, border-color 0.15s;
}
.pin-dot.filled { background: var(--accent); border-color: var(--accent); }
.pin-dot.error  { background: var(--red);   border-color: var(--red); }

.pin-grid {
  display: grid; grid-template-columns: repeat(3, 72px); gap: 12px;
  justify-content: center;
}
.pin-key {
  height: 72px; border-radius: var(--radius);
  background: var(--bg2); border: 1px solid var(--border);
  color: var(--txt); font-family: 'Montserrat', sans-serif;
  font-size: 20px; font-weight: 500;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: background 0.12s, transform 0.1s; user-select: none;
}
.pin-key:active { background: var(--bg3); transform: scale(0.96); }
.pin-key.del { background: transparent; border-color: transparent; color: var(--txt2); }
.pin-key.del:active { background: var(--bg2); }

.errmsg { margin-top: 20px; font-size: 12px; font-weight: 500; color: var(--red); min-height: 18px; text-align: center; }

/* ── SHELL ── */
#app { display: flex; flex-direction: column; height: 100dvh; }

header {
  background: rgba(0,0,0,0.85);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border-bottom: 1px solid var(--border);
  padding: calc(var(--safe-top) + 14px) 20px 14px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 100; flex-shrink: 0;
}
.header-left { display: flex; align-items: center; gap: 12px; }
.header-logo {
  width: 36px; height: 36px; border-radius: 10px;
  overflow: hidden; border: 1px solid var(--border);
}
.header-logo img { width: 100%; height: 100%; object-fit: cover; }
.header-brand { font-size: 16px; font-weight: 700; letter-spacing: -0.2px; }
.header-brand span { color: var(--accent); }
.last-update { font-size: 11px; color: var(--txt3); font-weight: 400; margin-top: 2px; letter-spacing: 0.2px; }
.header-actions { display: flex; gap: 8px; }
.icon-btn {
  width: 36px; height: 36px; border-radius: 10px;
  background: var(--bg2); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--txt2); transition: background 0.15s, color 0.15s;
}
.icon-btn:hover { background: var(--bg3); color: var(--txt); }
.icon-btn.danger:hover { background: var(--red-bg); color: var(--red); border-color: rgba(255,69,58,0.2); }

#scroll-body { flex: 1; overflow-y: auto; padding-bottom: calc(var(--safe-bot) + 16px); }

/* ── STATS ── */
.stats-section { padding: 16px 16px 8px; }
.stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat-card {
  background: var(--bg1); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 14px 12px 12px;
}
.stat-num { font-size: 26px; font-weight: 700; line-height: 1; letter-spacing: -0.5px; color: var(--txt); }
.stat-num.accent { color: var(--accent); }
.stat-num.pix    { color: var(--pix); }
.stat-lbl { font-size: 10px; font-weight: 600; color: var(--txt3); text-transform: uppercase; letter-spacing: 0.6px; margin-top: 6px; }

/* ── TOOLBAR ── */
.toolbar { padding: 8px 16px 10px; display: flex; gap: 8px; align-items: center; }
.search-wrap { flex: 1; position: relative; display: flex; align-items: center; }
.search-icon { position: absolute; left: 12px; color: var(--txt3); pointer-events: none; }
.search-input {
  width: 100%; background: var(--bg1); border: 1px solid var(--border);
  border-radius: var(--radius-sm); color: var(--txt);
  font-family: 'Montserrat', sans-serif; font-size: 13px; font-weight: 400;
  padding: 9px 12px 9px 36px; outline: none; transition: border-color 0.15s;
}
.search-input::placeholder { color: var(--txt3); }
.search-input:focus { border-color: var(--border2); }

.filter-row {
  padding: 0 16px 10px; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none;
}
.filter-row::-webkit-scrollbar { display: none; }
.chip {
  flex-shrink: 0; padding: 6px 14px; border-radius: 100px;
  border: 1px solid var(--border); background: var(--bg1); color: var(--txt2);
  font-family: 'Montserrat', sans-serif; font-size: 12px; font-weight: 500;
  cursor: pointer; transition: all 0.15s; white-space: nowrap;
}
.chip.active { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); }
.chip.active.pix-filter { background: var(--pix-bg); border-color: var(--pix); color: var(--pix); }

.sort-row { padding: 0 16px 12px; display: flex; gap: 6px; }
.sort-pill {
  padding: 5px 12px; border-radius: 100px; border: 1px solid var(--border);
  background: transparent; color: var(--txt3);
  font-family: 'Montserrat', sans-serif; font-size: 11px; font-weight: 600;
  cursor: pointer; transition: all 0.15s; white-space: nowrap; letter-spacing: 0.2px;
}
.sort-pill.active { border-color: var(--accent); color: var(--accent); }

/* ── LEADS ── */
.leads-section { padding: 0 16px; }

.lead-card {
  background: var(--bg1); border: 1px solid var(--border);
  border-radius: var(--radius-lg); margin-bottom: 8px; overflow: hidden;
  transition: border-color 0.2s; animation: fadeUp 0.18s ease both;
}
.lead-card.pix  { border-color: rgba(50,215,75,0.2); }
.lead-card:hover { border-color: var(--border2); }

.lead-header {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px; cursor: pointer;
}
.lead-avatar {
  width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0;
  background: var(--bg3); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 700; color: var(--txt2);
}
.lead-card.pix .lead-avatar { background: var(--pix-bg); border-color: rgba(50,215,75,0.3); color: var(--pix); }

.lead-info { flex: 1; min-width: 0; }
.lead-sid {
  font-size: 13px; font-weight: 600; color: var(--txt);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -0.1px;
}
.lead-sub { font-size: 11px; color: var(--txt3); margin-top: 3px; display: flex; gap: 10px; flex-wrap: wrap; font-weight: 400; }

.lead-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.badge { border-radius: 6px; padding: 3px 8px; font-size: 11px; font-weight: 600; white-space: nowrap; }
.badge-pix  { background: var(--pix-bg);  color: var(--pix); }
.badge-chat { background: var(--blue-bg); color: var(--blue); }
.badge-n    { background: var(--bg3);     color: var(--txt2); }

.chevron-icon { color: var(--txt3); flex-shrink: 0; transition: transform 0.2s; }
.lead-card.open .chevron-icon { transform: rotate(180deg); }

.btn-del {
  background: none; border: none; cursor: pointer;
  color: var(--txt3); padding: 4px; border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  transition: color 0.15s, background 0.15s;
}
.btn-del:hover { color: var(--red); background: var(--red-bg); }

/* ── CARD BODY ── */
.lead-body { display: none; border-top: 1px solid var(--border); }
.lead-card.open .lead-body { display: block; }

.detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap: 0; border-bottom: 1px solid var(--border); }
.d-cell { padding: 12px 16px; border-right: 1px solid var(--border); }
.d-cell:last-child { border-right: none; }
.d-lbl { font-size: 10px; font-weight: 600; color: var(--txt3); text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 4px; }
.d-val { font-size: 12px; font-weight: 500; color: var(--txt); word-break: break-all; }
.d-val.mono { font-family: 'SF Mono', 'Menlo', monospace; font-size: 11px; color: var(--txt2); }

.conv-bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 16px; border-bottom: 1px solid var(--border);
}
.conv-bar-title { font-size: 12px; font-weight: 600; color: var(--txt2); }
.conv-bar-meta  { font-size: 11px; color: var(--txt3); }

.msgs-wrap {
  padding: 14px 16px; display: flex; flex-direction: column; gap: 8px;
  max-height: 480px; overflow-y: auto; background: #050505;
}
.msg {
  max-width: 76%; padding: 9px 12px; border-radius: 12px;
  font-size: 13px; line-height: 1.6; word-break: break-word; position: relative;
}
.msg.bot  { background: var(--bg2); align-self: flex-start; border-bottom-left-radius: 3px; border: 1px solid var(--border); }
.msg.user { background: rgba(0,200,150,0.12); align-self: flex-end; border-bottom-right-radius: 3px; border: 1px solid rgba(0,200,150,0.18); }
.msg-role { font-size: 9px; font-weight: 700; letter-spacing: 0.7px; text-transform: uppercase; margin-bottom: 4px; }
.msg.bot  .msg-role { color: var(--txt3); }
.msg.user .msg-role { color: var(--accent); text-align: right; }
.msg-idx { font-size: 10px; color: var(--txt3); float: right; margin-left: 8px; margin-top: 2px; }

/* badge pix dentro da conversa */
.pix-event {
  align-self: center; background: var(--pix-bg);
  border: 1px solid rgba(50,215,75,0.25); border-radius: 100px;
  padding: 4px 14px; font-size: 11px; font-weight: 600; color: var(--pix);
  letter-spacing: 0.2px;
}

.empty-msgs { text-align: center; color: var(--txt3); font-size: 12px; padding: 24px; }

.state-box { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 24px; gap: 14px; }
.spinner { width: 24px; height: 24px; border: 2px solid var(--border2); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.state-txt { font-size: 13px; color: var(--txt3); font-weight: 400; }

/* ── MODAL ── */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.7);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  z-index: 500; display: flex; align-items: center; justify-content: center; padding: 24px;
}
.modal-overlay.hidden { display: none; }
.modal { background: var(--bg2); border: 1px solid var(--border2); border-radius: var(--radius-lg); padding: 28px 24px; max-width: 360px; width: 100%; text-align: center; }
.modal-icon { width: 48px; height: 48px; border-radius: 14px; background: var(--red-bg); border: 1px solid rgba(255,69,58,0.2); display: flex; align-items: center; justify-content: center; margin: 0 auto 18px; color: var(--red); }
.modal h3 { font-size: 17px; font-weight: 600; margin-bottom: 8px; }
.modal p  { font-size: 13px; color: var(--txt2); line-height: 1.6; margin-bottom: 24px; }
.modal-btns { display: flex; gap: 10px; }
.btn-modal { flex: 1; padding: 12px; border-radius: var(--radius-sm); font-family: 'Montserrat', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; border: none; transition: all 0.15s; }
.btn-cancel { background: var(--bg3); color: var(--txt2); }
.btn-cancel:hover { background: var(--bg4); }
.btn-delete { background: var(--red); color: #fff; }
.btn-delete:hover { background: #e53935; }

@keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">
      <img src="https://i.ibb.co/XZrKxkxY/czm-logo.png" onerror="this.style.display='none';this.parentElement.innerHTML='<svg width=26 height=26 viewBox=\'0 0 24 24\' fill=\'none\'><rect x=\'3\' y=\'11\' width=\'18\' height=\'11\' rx=\'2\' stroke=\'%2300c896\' stroke-width=\'1.6\'/><path d=\'M7 11V7a5 5 0 0110 0v4\' stroke=\'%2300c896\' stroke-width=\'1.6\' stroke-linecap=\'round\'/></svg>'" alt="CZM">
    </div>
    <h1>CZM Painel</h1>
    <p>Digite sua senha para acessar</p>
    <div class="pin-dots" id="pin-dots">
      <div class="pin-dot" id="dot-0"></div>
      <div class="pin-dot" id="dot-1"></div>
      <div class="pin-dot" id="dot-2"></div>
      <div class="pin-dot" id="dot-3"></div>
    </div>
    <div class="pin-grid">
      <button class="pin-key" onclick="pinPress('1')">1</button>
      <button class="pin-key" onclick="pinPress('2')">2</button>
      <button class="pin-key" onclick="pinPress('3')">3</button>
      <button class="pin-key" onclick="pinPress('4')">4</button>
      <button class="pin-key" onclick="pinPress('5')">5</button>
      <button class="pin-key" onclick="pinPress('6')">6</button>
      <button class="pin-key" onclick="pinPress('7')">7</button>
      <button class="pin-key" onclick="pinPress('8')">8</button>
      <button class="pin-key" onclick="pinPress('9')">9</button>
      <button class="pin-key del" onclick="pinDel()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M21 12H3M9 6l-6 6 6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="pin-key" onclick="pinPress('0')">0</button>
      <button class="pin-key del" onclick="pinDel()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M20 9H11L7.5 12 11 15H20V9Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M15 12.5V12M13 10.5l4 3M17 10.5l-4 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="errmsg" id="errmsg"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <header>
    <div class="header-left">
      <div class="header-logo">
        <img src="https://i.ibb.co/XZrKxkxY/czm-logo.png" onerror="this.style.display='none'" alt="CZM">
      </div>
      <div>
        <div class="header-brand">CZM <span>Painel</span></div>
        <div class="last-update" id="last-update">Aguardando</div>
      </div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" onclick="load(true)" title="Atualizar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 4v5h.582m0 0a8 8 0 0115.356 2M4.582 9H9M20 20v-5h-.582m0 0a8 8 0 01-15.356-2M19.418 15H15" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="icon-btn danger" onclick="confirmarLimparTudo()" title="Limpar tudo">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><polyline points="3 6 5 6 21 6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M19 6l-1 14H6L5 6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 11v6M14 11v6M9 6V4h6v2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </header>

  <div id="scroll-body">
    <div class="stats-section">
      <div class="stats-grid">
        <div class="stat-card"><div class="stat-num" id="s-total">—</div><div class="stat-lbl">Leads</div></div>
        <div class="stat-card"><div class="stat-num" id="s-hoje">—</div><div class="stat-lbl">Hoje</div></div>
        <div class="stat-card"><div class="stat-num pix" id="s-pix">—</div><div class="stat-lbl">Recebeu Pix</div></div>
        <div class="stat-card"><div class="stat-num accent" id="s-conv">—</div><div class="stat-lbl">Conversão</div></div>
        <div class="stat-card"><div class="stat-num" id="s-msgs">—</div><div class="stat-lbl">Mensagens</div></div>
        <div class="stat-card"><div class="stat-num" id="s-media">—</div><div class="stat-lbl">Média/lead</div></div>
      </div>
    </div>

    <div class="toolbar">
      <div class="search-wrap">
        <span class="search-icon">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="1.7"/><path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        </span>
        <input class="search-input" id="busca" placeholder="Buscar por ID, sessão ou mensagem..." oninput="renderLeads()">
      </div>
    </div>

    <div class="filter-row">
      <button class="chip active"     data-filter="todos"   onclick="setFilter('todos',this)">Todos</button>
      <button class="chip pix-filter" data-filter="pix"     onclick="setFilter('pix',this)">Recebeu Pix</button>
      <button class="chip"            data-filter="chat"    onclick="setFilter('chat',this)">Só conversando</button>
      <button class="chip"            data-filter="hoje"    onclick="setFilter('hoje',this)">Hoje</button>
      <button class="chip"            data-filter="semMsgs" onclick="setFilter('semMsgs',this)">Sem msgs</button>
    </div>

    <div class="sort-row">
      <button class="sort-pill active" id="sort-recente" onclick="setSort('recente')">Mais recentes</button>
      <button class="sort-pill"        id="sort-msgs"    onclick="setSort('msgs')">Mais msgs</button>
      <button class="sort-pill"        id="sort-duracao" onclick="setSort('duracao')">Mais duração</button>
    </div>

    <div class="leads-section" id="leads-wrap">
      <div class="state-box"><div class="spinner"></div><div class="state-txt">Carregando leads...</div></div>
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay hidden" id="modal-del">
  <div class="modal">
    <div class="modal-icon">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><polyline points="3 6 5 6 21 6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M19 6l-1 14H6L5 6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 11v6M14 11v6M9 6V4h6v2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <h3 id="modal-title">Excluir lead?</h3>
    <p id="modal-desc">Esta ação não pode ser desfeita.</p>
    <div class="modal-btns">
      <button class="btn-modal btn-cancel" onclick="fecharModal()">Cancelar</button>
      <button class="btn-modal btn-delete" id="modal-confirm">Excluir</button>
    </div>
  </div>
</div>

<script>

const SUPA_URL = 'https://zwmoojqayjjfcoatgtii.supabase.co';

let allLeads=[], sortMode='recente', filterMode='todos', openCards=new Set(), scrollPos={}, pinVal='';

/* ── PIN ── */
function updateDots(){for(let i=0;i<4;i++){const d=document.getElementById('dot-'+i);d.className='pin-dot'+(i<pinVal.length?' filled':'');}}
function pinPress(d){if(pinVal.length>=4)return;pinVal+=d;updateDots();if(pinVal.length===4)setTimeout(checkPin,80);}
function pinDel(){if(!pinVal.length)return;pinVal=pinVal.slice(0,-1);updateDots();}
function checkPin(){
  if(pinVal===SENHA){document.getElementById('login-screen').classList.add('hidden');load();}
  else{
    for(let i=0;i<4;i++){document.getElementById('dot-'+i).className='pin-dot error';}
    document.getElementById('errmsg').textContent='Senha incorreta';
    setTimeout(()=>{pinVal='';updateDots();document.getElementById('errmsg').textContent='';},700);
  }
}
document.addEventListener('keydown',e=>{
  if(!document.getElementById('login-screen').classList.contains('hidden')){
    if(e.key>='0'&&e.key<='9')pinPress(e.key);
    if(e.key==='Backspace')pinDel();
  }
});

/* ── FILTER / SORT ── */
function setFilter(f,el){
  filterMode=f;
  document.querySelectorAll('.chip').forEach(c=>{c.classList.remove('active');});
  el.classList.add('active');
  renderLeads();
}
function setSort(m){
  sortMode=m;
  document.querySelectorAll('.sort-pill').forEach(b=>b.classList.remove('active'));
  document.getElementById('sort-'+m).classList.add('active');
  renderLeads();
}

/* ── FORMAT ── */
function fmtData(iso){if(!iso)return'—';const d=new Date(iso);return d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});}
function calcDuracao(inicio,fim){if(!inicio||!fim)return null;const ms=new Date(fim)-new Date(inicio);if(isNaN(ms)||ms<0)return null;const min=Math.floor(ms/60000);if(min<1)return'< 1 min';if(min<60)return min+' min';const h=Math.floor(min/60),m=min%60;return h+'h'+(m>0?' '+m+'min':'');}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function initials(sid){const s=String(sid||'').replace(/[^a-zA-Z0-9]/g,'');return(s[0]||'?').toUpperCase()+(s[1]||'').toUpperCase();}

/* ── LOAD ── */
async function load(manual=false){
  if(manual)saveScrollStates();
  try{
    const res=await fetch(`${SUPA_URL}/rest/v1/leads?order=criado_em.desc&limit=1000`,{headers:{'apikey':SUPA_KEY,'Authorization':`Bearer ${SUPA_KEY}`}});
    const data=await res.json();
    allLeads=Array.isArray(data)?data:[];
    updateStats();renderLeads();
    document.getElementById('last-update').textContent='Atualizado '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  }catch(e){document.getElementById('leads-wrap').innerHTML='<div class="state-box"><div class="state-txt">Erro ao carregar dados</div></div>';}
}
function saveScrollStates(){
  document.querySelectorAll('.lead-card.open').forEach(c=>{const id=c.dataset.id;const w=c.querySelector('.msgs-wrap');if(w&&id)scrollPos[id]=w.scrollTop;});
}

/* ── STATS ── */
function updateStats(){
  const hoje=new Date().toDateString();
  const hojeC=allLeads.filter(r=>new Date(r.criado_em).toDateString()===hoje).length;
  // clicou_cta = recebeu o pix
  const pixC=allLeads.filter(r=>r.clicou_cta).length;
  const totalM=allLeads.reduce((a,r)=>a+(Array.isArray(r.mensagens)?r.mensagens.length:0),0);
  const media=allLeads.length?(totalM/allLeads.length).toFixed(1):'0';
  const conv=allLeads.length?Math.round((pixC/allLeads.length)*100)+'%':'0%';
  document.getElementById('s-total').textContent=allLeads.length;
  document.getElementById('s-hoje').textContent=hojeC;
  document.getElementById('s-pix').textContent=pixC;
  document.getElementById('s-msgs').textContent=totalM;
  document.getElementById('s-media').textContent=media;
  document.getElementById('s-conv').textContent=conv;
}

/* ── FILTER ── */
function getFiltered(){
  const busca=document.getElementById('busca').value.toLowerCase().trim();
  const hoje=new Date().toDateString();
  let arr=[...allLeads];
  if(filterMode==='pix')          arr=arr.filter(r=>r.clicou_cta);
  else if(filterMode==='chat')    arr=arr.filter(r=>!r.clicou_cta);
  else if(filterMode==='hoje')    arr=arr.filter(r=>new Date(r.criado_em).toDateString()===hoje);
  else if(filterMode==='semMsgs') arr=arr.filter(r=>!r.mensagens||!r.mensagens.length);
  if(busca){arr=arr.filter(r=>{const sid=(r.session_id||'').toLowerCase();const uid=(r.id||'').toLowerCase();const msgs=JSON.stringify(r.mensagens||'').toLowerCase();return sid.includes(busca)||uid.includes(busca)||msgs.includes(busca);});}
  if(sortMode==='msgs')    arr.sort((a,b)=>(b.mensagens?.length||0)-(a.mensagens?.length||0));
  else if(sortMode==='duracao')arr.sort((a,b)=>{const da=new Date(a.ultima_mensagem||0)-new Date(a.criado_em||0);const db=new Date(b.ultima_mensagem||0)-new Date(b.criado_em||0);return db-da;});
  return arr;
}

/* ── RENDER ── */
function renderLeads(){
  const wrap=document.getElementById('leads-wrap');
  const arr=getFiltered();
  if(!arr.length){wrap.innerHTML='<div class="state-box"><div class="state-txt">Nenhum lead encontrado</div></div>';return;}

  let html='';
  arr.forEach((r,idx)=>{
    const id=String(r.id||r.session_id||Math.random());
    const isOpen=openCards.has(id);
    const msgs=Array.isArray(r.mensagens)?r.mensagens:[];
    const msgCount=msgs.length;
    const isPix=!!r.clicou_cta;
    const duracao=calcDuracao(r.criado_em,r.ultima_mensagem);
    const sidFull=r.session_id||'—';
    const sidCurto=sidFull.length>18?sidFull.slice(0,18)+'…':sidFull;
    const botMsgs=msgs.filter(m=>m.role==='assistant').length;
    const userMsgs=msgs.filter(m=>m.role==='user').length;
    const ini=initials(sidFull);

    let msgsHtml='';
    if(msgCount){
      msgs.forEach((m,i)=>{
        const isBot=m.role==='assistant';
        const txt=esc(m.text||m.content||'').replace(/\n/g,'<br>');
        // detecta gatilho do pix na mensagem do bot
        const rawTxt=(m.text||m.content||'').toLowerCase();
        const temPix=/aqui o pix|aqui.*pix|pix.*aqui|um desconto/i.test(rawTxt);
        msgsHtml+=`<div class="msg ${isBot?'bot':'user'}"><div class="msg-role">${isBot?'Vanessa':'Lead'}</div>${txt}<span class="msg-idx">#${i+1}</span></div>`;
        if(isBot&&temPix){
          msgsHtml+=`<div class="pix-event">💸 Pix enviado ao lead</div>`;
        }
      });
    }else{
      msgsHtml='<div class="empty-msgs">Sem mensagens registradas</div>';
    }

    html+=`
    <div class="lead-card${isPix?' pix':''}${isOpen?' open':''}" data-id="${esc(id)}" style="animation-delay:${idx*0.02}s">
      <div class="lead-header" onclick="toggleCard('${id.replace(/'/g,"\\'")}',event)">
        <div class="lead-avatar">${ini}</div>
        <div class="lead-info">
          <div class="lead-sid">${esc(sidCurto)}</div>
          <div class="lead-sub">
            <span>${fmtData(r.criado_em)}</span>
            ${duracao?`<span>${duracao}</span>`:''}
          </div>
        </div>
        <div class="lead-right">
          <span class="badge ${isPix?'badge-pix':'badge-chat'}">${isPix?'Recebeu Pix':'Chat'}</span>
          <span class="badge badge-n">${msgCount}</span>
          <button class="btn-del" title="Excluir" onclick="confirmarDelLead(event,'${id.replace(/'/g,"\\'")}','${esc(sidCurto).replace(/'/g,"\\'")}')">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </button>
          <svg class="chevron-icon" width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
      </div>
      <div class="lead-body">
        <div class="detail-grid">
          <div class="d-cell"><div class="d-lbl">UUID</div><div class="d-val mono">${esc(r.id||'—')}</div></div>
          <div class="d-cell"><div class="d-lbl">Session ID</div><div class="d-val mono">${esc(sidFull)}</div></div>
          <div class="d-cell"><div class="d-lbl">Status</div><div class="d-val">${isPix?'Recebeu Pix':'Conversando'}</div></div>
          <div class="d-cell"><div class="d-lbl">Início</div><div class="d-val">${fmtData(r.criado_em)}</div></div>
          <div class="d-cell"><div class="d-lbl">Última msg</div><div class="d-val">${fmtData(r.ultima_mensagem)}</div></div>
          ${duracao?`<div class="d-cell"><div class="d-lbl">Duração</div><div class="d-val">${duracao}</div></div>`:''}
          <div class="d-cell"><div class="d-lbl">Msgs bot</div><div class="d-val">${botMsgs}</div></div>
          <div class="d-cell"><div class="d-lbl">Msgs lead</div><div class="d-val">${userMsgs}</div></div>
        </div>
        <div class="conv-bar">
          <div class="conv-bar-title">Conversa completa</div>
          <div class="conv-bar-meta">${msgCount} msgs · bot ${botMsgs} · lead ${userMsgs}</div>
        </div>
        <div class="msgs-wrap" id="msgs-${esc(id)}">${msgsHtml}</div>
      </div>
    </div>`;
  });

  wrap.innerHTML=html;
  openCards.forEach(id=>{
    const w=document.getElementById('msgs-'+CSS.escape(id));
    if(!w)return;
    w.scrollTop=scrollPos[id]!=null?scrollPos[id]:w.scrollHeight;
  });
}

/* ── TOGGLE ── */
function toggleCard(id,e){
  if(e&&e.target.closest('.btn-del'))return;
  const card=document.querySelector(`.lead-card[data-id="${CSS.escape(id)}"]`);
  if(!card)return;
  const nowOpen=!card.classList.contains('open');
  card.classList.toggle('open',nowOpen);
  if(nowOpen){openCards.add(id);const w=card.querySelector('.msgs-wrap');if(w)setTimeout(()=>{w.scrollTop=w.scrollHeight;},50);}
  else{openCards.delete(id);delete scrollPos[id];}
}

/* ── DELETE ── */
function confirmarDelLead(e,id,sid){
  e.stopPropagation();
  document.getElementById('modal-title').textContent='Excluir este lead?';
  document.getElementById('modal-desc').textContent=`O lead "${sid}" e toda a conversa serão apagados permanentemente.`;
  document.getElementById('modal-confirm').onclick=()=>deleteLead(id);
  document.getElementById('modal-del').classList.remove('hidden');
}
function confirmarLimparTudo(){
  if(!allLeads.length)return;
  document.getElementById('modal-title').textContent='Limpar todos os leads?';
  document.getElementById('modal-desc').textContent=`${allLeads.length} leads serão apagados permanentemente. Esta ação não pode ser desfeita.`;
  document.getElementById('modal-confirm').onclick=()=>deletarTudo();
  document.getElementById('modal-del').classList.remove('hidden');
}
function fecharModal(){document.getElementById('modal-del').classList.add('hidden');}

async function deleteLead(id){
  fecharModal();
  try{
    await fetch(`${SUPA_URL}/rest/v1/leads?id=eq.${encodeURIComponent(id)}`,{method:'DELETE',headers:{'apikey':SUPA_KEY,'Authorization':`Bearer ${SUPA_KEY}`,'Prefer':'return=minimal'}});
    openCards.delete(id);delete scrollPos[id];
    allLeads=allLeads.filter(r=>String(r.id)!==String(id));
    updateStats();renderLeads();
  }catch(e){alert('Erro ao excluir lead.');}
}
async function deletarTudo(){
  fecharModal();
  try{
    await fetch(`${SUPA_URL}/rest/v1/leads?id=neq.00000000-0000-0000-0000-000000000000`,{method:'DELETE',headers:{'apikey':SUPA_KEY,'Authorization':`Bearer ${SUPA_KEY}`,'Prefer':'return=minimal'}});
    allLeads=[];openCards.clear();scrollPos={};
    updateStats();renderLeads();
  }catch(e){alert('Erro ao limpar leads.');}
}
document.getElementById('modal-del').addEventListener('click',function(e){if(e.target===this)fecharModal();});

setInterval(()=>{if(document.getElementById('login-screen').classList.contains('hidden')){saveScrollStates();load();}},30000);
</script>
